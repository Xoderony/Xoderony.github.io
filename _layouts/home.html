---
layout: default
---

<div class="home">
  {{ content }}

  {%- if site.posts.size > 0 -%}
  <ul class="post-list">
    {%- for post in site.posts -%}
    <li>
      <a class="post-row" href="{{ post.url | relative_url }}">
        <time class="post-meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
        <span class="post-link">{{ post.title | escape }}</span>
      </a>
    </li>
    {%- endfor -%}
  </ul>
  {%- endif -%}
</div>
