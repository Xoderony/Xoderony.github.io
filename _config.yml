# Xoderony — GitHub Pages / Jekyll (Minima)
title: Xoderony
description: 游戏开发者
url: "https://xoderony.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: Xoderony
  email: 3503922521@qq.com

github_username: Xoderony

theme: minima

header_pages:
  - tags.html
  - about.md

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
