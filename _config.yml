# Xoderony — GitHub Pages / Jekyll
title: Xoderony
description: 传奇の开始
url: "https://xoderony.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: Xoderony
  email: 3503922521@qq.com
  github: Xoderony

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
